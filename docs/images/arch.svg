<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2860 980" width="2860" height="980" role="img" aria-label="agentkit overview: your app starts and reads runs, the kernel claims a run and calls your strategy one transition at a time, each transition is committed to your store, and the run moves between pending, running and waiting before finishing">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#5A4BDB"/>
    </marker>
    <style>
      .eyebrow { font: 600 26px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 2.6px; fill: #9A97B5; }
      .title   { font: 600 54px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1D1B2E; }
      .body    { font: 400 30px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4C4A63; }
      .api     { font: 500 28px "SF Mono", ui-monospace, Menlo, monospace; fill: #5A4BDB; }
      .edge    { font: 400 27px Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #5A4BDB; }
      .state   { font: 500 32px "SF Mono", ui-monospace, Menlo, monospace; fill: #1D1B2E; }
      .stateon { font: 500 32px "SF Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
      .term    { font: 500 27px "SF Mono", ui-monospace, Menlo, monospace; fill: #1D1B2E; }
      .line    { stroke: #5A4BDB; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="2860" height="980" fill="#FFFFFF"/>

  <!-- your app -->
  <rect x="60" y="330" width="540" height="320" rx="20" fill="#F7F6FE" stroke="#DCD7F5" stroke-width="2"/>
  <text class="title" x="110" y="425">Your app</text>
  <text class="body" x="110" y="492">starts runs and reads them</text>
  <text class="api" x="110" y="556">Spawn · Respond · GetProcess</text>

  <!-- agentkit -->
  <rect x="760" y="80" width="1340" height="820" rx="24" fill="#F8F7FE" stroke="#5A4BDB" stroke-width="3"/>
  <text class="eyebrow" x="810" y="142">AGENTKIT</text>

  <rect x="810" y="170" width="1240" height="200" rx="18" fill="#FFFFFF" stroke="#DCD7F5" stroke-width="2"/>
  <text class="title" x="860" y="255">Kernel</text>
  <text class="body" x="860" y="320">claims a run and calls your Strategy — one transition at a time,</text>
  <text class="body" x="860" y="360">each one committed before the next starts</text>

  <rect x="810" y="420" width="1240" height="440" rx="18" fill="#FFFFFF" stroke="#DCD7F5" stroke-width="2"/>
  <text class="title" x="860" y="480" font-size="40">Process — one run, checkpointed</text>

  <!-- lifecycle -->
  <text class="edge" x="958" y="692">Spawn</text>
  <path class="line" d="M950,632 H1042" marker-end="url(#arrow)"/>

  <rect x="1050" y="600" width="200" height="64" rx="32" fill="#FFFFFF" stroke="#C9C2EE" stroke-width="2"/>
  <text class="state" x="1150" y="643" text-anchor="middle">pending</text>
  <rect x="1380" y="600" width="200" height="64" rx="32" fill="#FFFFFF" stroke="#C9C2EE" stroke-width="2"/>
  <text class="state" x="1480" y="643" text-anchor="middle">running</text>
  <rect x="1710" y="600" width="200" height="64" rx="32" fill="#5A4BDB" stroke="#5A4BDB" stroke-width="2"/>
  <text class="stateon" x="1810" y="643" text-anchor="middle">waiting</text>

  <path class="line" d="M1255,632 H1372" marker-end="url(#arrow)"/>
  <text class="edge" x="1314" y="692" text-anchor="middle">claim</text>
  <path class="line" d="M1585,632 H1702" marker-end="url(#arrow)"/>
  <text class="edge" x="1644" y="692" text-anchor="middle">Suspend</text>

  <path class="line" d="M1810,596 V540 H1150 V592" marker-end="url(#arrow)"/>
  <text class="edge" x="1480" y="524" text-anchor="middle">an answer, a due timer, or a finished child</text>

  <path class="line" d="M1480,668 V724" marker-end="url(#arrow)"/>
  <rect x="1240" y="728" width="480" height="72" rx="18" fill="#FFFFFF" stroke="#C9C2EE" stroke-width="2"/>
  <text class="term" x="1480" y="773" text-anchor="middle">succeeded · failed · cancelled</text>

  <!-- your store / llm -->
  <rect x="2260" y="170" width="540" height="280" rx="20" fill="#FFFFFF" stroke="#C9C2EE" stroke-width="2" stroke-dasharray="10 8"/>
  <text class="title" x="2310" y="262">Repository</text>
  <text class="body" x="2310" y="329">your store — every transition</text>
  <text class="body" x="2310" y="369">lands here</text>

  <rect x="2260" y="560" width="540" height="280" rx="20" fill="#FFFFFF" stroke="#C9C2EE" stroke-width="2" stroke-dasharray="10 8"/>
  <text class="title" x="2310" y="652">LLM &amp; tools</text>
  <text class="body" x="2310" y="719">called through the kernel's</text>
  <text class="body" x="2310" y="759">syscalls, where limits apply</text>

  <!-- crossing arrows -->
  <path class="line" d="M612,450 H752" marker-end="url(#arrow)"/>
  <text class="edge" x="682" y="424" text-anchor="middle">calls in</text>
  <path class="line" d="M752,540 H612" marker-end="url(#arrow)"/>
  <text class="edge" x="682" y="514" text-anchor="middle">reads</text>

  <path class="line" d="M2108,300 H2252" marker-end="url(#arrow)"/>
  <text class="edge" x="2180" y="274" text-anchor="middle">commits</text>
  <path class="line" d="M2108,690 H2252" marker-end="url(#arrow)"/>
  <text class="edge" x="2180" y="664" text-anchor="middle">syscalls</text>
</svg>
